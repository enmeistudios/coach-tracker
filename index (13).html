<style>

    --bg:#000000;
    --sidebar-bg:#0A0A0A;

    --surface-hover:#1B1C1F;
    --ink:#F2F3F5;
    --ink-soft:#8B8F99;
    --line:rgba(255,255,255,0.09);
    --brand:#FF8A3D;
    --green:#33D68C;
    --green-bg:rgba(51,214,140,0.12);
    --orange:#FFB020;
    --orange-bg:rgba(255,176,32,0.12);
    --red:#FF5C5C;
    --red-bg:rgba(255,92,92,0.14);
    --gray:#7C8291;
    --gray-bg:rgba(124,130,145,0.14);

  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.topbar{
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  header.topbar .brand-block{display:flex; flex-direction:column; gap:2px;}
  header.topbar h1{font-size:1.15rem; font-weight:700; color:var(--brand); letter-spacing:-0.01em;}
  header.topbar .sub{font-size:0.72rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .coach-jump{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:0.82rem; font-weight:600; padding:8px 12px;
    border-radius:8px; cursor:pointer; min-width:190px;
  }
  .coach-jump:focus{outline:2px solid var(--brand); outline-offset:1px;}

  nav.tabbar{
    background:var(--sidebar-bg); border-bottom:1px solid var(--line);
    padding:0 24px; display:flex; gap:4px; overflow-x:auto;
  }
  .tab{
    padding:11px 16px; font-size:0.84rem; font-weight:600; color:var(--ink-soft);
    cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:color .15s, border-color .15s;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--brand); border-bottom-color:var(--brand);}

  main{padding:26px 30px 60px; min-width:0; max-width:1280px; margin:0 auto;}

  .legend{
    display:flex; gap:18px; align-items:center; font-size:0.78rem; color:var(--ink-soft);
    margin:0 0 18px; flex-wrap:wrap;
  }
  .legend .item{display:flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot.green{background:var(--green);} .dot.orange{background:var(--orange);}
  .dot.red{background:var(--red);} .dot.gray{background:var(--gray);}

  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:20px;
    font-size:0.76rem; font-weight:600; white-space:nowrap;
  }
  .chip.green{background:var(--green-bg); color:var(--green);}
  .chip.orange{background:var(--orange-bg); color:var(--orange);}
  .chip.red{background:var(--red-bg); color:var(--red);}
  .chip.gray{background:var(--gray-bg); color:var(--gray);}
  .chip .dot{width:7px; height:7px;}

  .view-title{font-size:1.15rem; font-weight:700; margin-bottom:4px;}
  .view-sub{font-size:0.83rem; color:var(--ink-soft); margin-bottom:20px;}

  .simple-list{display:flex; flex-direction:column; gap:8px;}
  .simple-row{
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer;
  }
  .simple-row:hover{background:var(--surface-hover);}
  .simple-row .name{font-weight:600; font-size:0.88rem;}

  .attn-row{border-left:3px solid var(--gray);}
  .attn-row.red{border-left-color:var(--red);}
  .attn-row.orange{border-left-color:var(--orange);}
  .attn-row .item-label{color:var(--ink-soft); font-size:0.78rem; margin-top:2px;}

  .empty-state{padding:40px; text-align:center; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); border-radius:10px;}
  .empty-state .big{font-size:1.8rem; margin-bottom:6px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .stat-card .num{font-family:'Space Grotesk',sans-serif; font-size:1.7rem; font-weight:700;}
  .stat-card .lbl{font-size:0.75rem; color:var(--ink-soft); margin-top:2px;}
  .stat-card.red .num{color:var(--red);}
  .stat-card.orange .num{color:var(--orange);}
  .stat-card.green .num{color:var(--green);}

  .detail-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px;}
  .section-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}

  .row-item:last-child{border-bottom:none;}
  .row-item .label{color:var(--ink-soft);}
  .row-item .val{font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--ink);}

  .updated-note{font-size:0.72rem; color:var(--ink-soft); margin-top:26px; font-family:'IBM Plex Mono',monospace;}

  .data-footer .status-dot.static{background:var(--gray);}
  .data-footer strong{color:var(--ink); font-weight:600;}

  .widget{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; display:flex; flex-direction:column;}

  .stacked-bar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--gray-bg); margin:10px 0 8px;}

  /* ---- toggle group ---- */

  .toggle-btn{padding:7px 15px; font-size:0.78rem; font-weight:600; color:var(--ink-soft); cursor:pointer; background:transparent;}
  .toggle-btn.active{background:var(--surface-hover); color:var(--brand);}
  .toggle-btn:not(:last-child){border-right:1px solid var(--line);}

  /* ---- section separation ---- */
  .section-label{font-size:0.72rem; text-transform:uppercase; letter-spacing:.06em; color:#565B66; margin:30px 0 10px; font-weight:600;}
  .section-label:first-of-type{margin-top:0;}

  .flag-banner.ok{background:var(--green-bg); border:1px solid rgba(51,214,140,0.35);}

  .kanban-count{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.5rem; margin-bottom:10px; color:var(--ink);}
  .kanban-card{background:var(--surface-hover); border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px; cursor:pointer;}

  .kanban-card .kc-sub{font-size:0.71rem; color:var(--ink-soft); margin-bottom:7px;}
  .kanban-empty{font-size:0.78rem; color:var(--ink-soft); padding:8px 0 14px;}
  .roster-row{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:12px 16px; cursor:pointer;}
  .roster-row:hover{background:var(--surface-hover);}
  .roster-row .name{font-weight:600; font-size:0.88rem;}
  .roster-head{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:10px; font-size:0.7rem; text-transform:uppercase; letter-spacing:.05em; color:#565B66; padding:0 16px; margin-bottom:8px;}

  /* ---- progress bar (coach detail) ---- */
  .progress-wrap{position:relative; padding:8px 6px 30px; margin-top:6px;}
  .progress-track{position:relative; height:6px; background:var(--line); border-radius:3px;}
  .progress-fill{position:absolute; top:0; left:0; height:100%; border-radius:3px; background:var(--brand);}
  .progress-node{position:absolute; top:-7px; width:20px; height:20px; border-radius:50%; background:var(--surface); border:3px solid var(--gray); transform:translateX(-50%);}
  .progress-node.green{border-color:var(--green);}
  .progress-node.orange{border-color:var(--orange);}
  .progress-node.red{border-color:var(--red);}
  .progress-node.gray{border-color:var(--gray);}
  .progress-label{position:absolute; top:16px; transform:translateX(-50%); font-size:0.68rem; color:var(--ink-soft); white-space:nowrap;}

  @media (max-width:760px){
    main{padding:18px 16px 50px;}
    .roster-row, .roster-head{grid-template-columns:1.2fr 1fr 1fr;}
    .roster-head span:nth-child(2), .roster-row > div:nth-child(2){display:none;}
  }
</style>
</head>

const ORANGE_WINDOW_DAYS = 30;

/* ---------- date helpers ---------- */
function parseDate(str){
  if(!str) return null;
  const d = new Date(str.slice(0,10) + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function today(){
  const t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}
function daysFromToday(dateStr){
  const d = parseDate(dateStr);
  if(!d) return null;
  return Math.round((d - today()) / 86400000);
}
function addMonths(dateStr, months){
  const d = parseDate(dateStr);
  if(!d) return null;
  const r = new Date(d);
  r.setMonth(r.getMonth() + months);
  return r;
}
function fmt(dateStr){
  if(!dateStr) return "—";
  const d = parseDate(dateStr);
  if(!d) return dateStr;
  return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

/* ---------- status logic ---------- */
function milestoneStatus(startDate, completionDate, months, label){
  if(completionDate){
    return {status:'green', text:'Completed ' + fmt(completionDate), dueDate: completionDate};
  }
  if(!startDate){
    return {status:'gray', text:'No start date on file', dueDate: null};
  }
  const due = addMonths(startDate, months);
  const days = Math.round((due - today()) / 86400000);
  const dueISO = due.toISOString().slice(0,10);
  if(days < 0) return {status:'red', text:'Overdue — was due ' + due.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), dueDate: dueISO};
  if(days <= ORANGE_WINDOW_DAYS) return {status:'orange', text:'Due ' + due.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), dueDate: dueISO};
  return {status:'green', text:'Not yet due (' + due.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ')', dueDate: dueISO};
}

function recurringStatus(nextDate){
  if(!nextDate) return {status:'orange', text:'Next date not scheduled'};
  const days = daysFromToday(nextDate);
  if(days < 0) return {status:'red', text:'Overdue since ' + fmt(nextDate)};
  if(days <= ORANGE_WINDOW_DAYS) return {status:'orange', text:'Due ' + fmt(nextDate)};
  return {status:'green', text:'Scheduled ' + fmt(nextDate)};
}

function expiryStatus(obtainedDate, expiryDate){
  if(!obtainedDate) return {status:'red', text:'Not on file'};
  if(!expiryDate) return {status:'orange', text:'Missing expiry date'};
  const days = daysFromToday(expiryDate);
  if(days < 0) return {status:'red', text:'Expired ' + fmt(expiryDate)};
  if(days <= ORANGE_WINDOW_DAYS) return {status:'orange', text:'Expires ' + fmt(expiryDate)};
  return {status:'green', text:'Valid through ' + fmt(expiryDate)};
}

function onceStatus(date){
  if(!date) return {status:'red', text:'Not on file'};
  return {status:'green', text:'On file ' + fmt(date)};
}

const RANK = {red:3, orange:2, gray:1, green:0};
function worst(list){
  return list.reduce((a,b) => RANK[b.status] > RANK[a.status] ? b : a);
}

function chipHTML(s){
  return `<span class="chip ${s.status}"><span class="dot ${s.status}"></span>${s.text}</span>`;
}

function flagStatus(currentFlag){
  const f = (currentFlag || '').trim().toLowerCase();
  if(f === 'formal pip') return {status:'red', text:'Formal PIP'};
  if(f === 'concern') return {status:'red', text:'Concern'};
  if(f === 'watch') return {status:'orange', text:'Watch'};
  return {status:'green', text:'None'};
}

function devPlanStatus(c){
  if(isTruthyFlag(c.coach.onDevPlan)){
    return {status:'orange', text:'On development plan since ' + fmt(c.coach.devPlanStart)};
  }
  return {status:'green', text:'Not on a development plan'};
}

/* ---------- compute all statuses for a coach ---------- */
function computeCoach(c){
  const m3 = milestoneStatus(c.startDate, c.m3Date, 3, '3-month');
  const m6 = milestoneStatus(c.startDate, c.m6Date, 6, '6-month');
  const m12 = milestoneStatus(c.startDate, c.m12Date, 12, '12-month');
  const obs = recurringStatus(c.nextObs);
  const oneOnOne = recurringStatus(c.next1on1);
  const liability = expiryStatus(c.liabilityDate, c.liabilityExpiry);
  const firstAid = expiryStatus(c.firstAidDate, c.firstAidExpiry);
  const fire = onceStatus(c.fireTrainingDate);
  const milestones = {m3, m6, m12, overall: worst([m3,m6,m12])};
  const observations = {obs, oneOnOne, overall: worst([obs, oneOnOne])};
  const compliance = {liability, firstAid, fire, overall: worst([liability, firstAid, fire])};
  return { coach: c, milestones, observations, compliance };
}

function statusColorVar(status){
  return status === 'gray' ? 'var(--gray)' : `var(--${status})`;
}

function stackedBarHTML(counts, total){
  const order = ['red','orange','gray','green'];
  const bars = order.map(k => {
    const val = counts[k] || 0;
    const pct = total ? (val/total*100) : 0;
    return pct > 0 ? `<div style="width:${pct}%;background:${statusColorVar(k)}"></div>` : '';
  }).join('');
  return `<div class="stacked-bar">${bars}</div>`;
}

function donutSVG(counts, total){
  const order = ['red','orange','gray','green'];
  const r = 52, cx = 64, cy = 64, circ = 2 * Math.PI * r;
  let prevSum = 0;
  const circles = order.map(k => {
    const val = counts[k] || 0;
    const frac = total ? val/total : 0;
    const len = frac * circ;
    const dashoffset = circ - prevSum;
    prevSum += len;
    if(len <= 0) return '';
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${statusColorVar(k)}" stroke-width="15" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg viewBox="0 0 128 128" width="128" height="128">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="15"/>
    ${circles}
    <text x="64" y="59" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" font-family="Space Grotesk, sans-serif">${total}</text>
    <text x="64" y="77" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="Inter, sans-serif">coaches</text>
  </svg>`;
}

/* ---------- quarter tracking (observations) ---------- */
function currentQuarterObj(){
  const t = today();
  return { year: t.getFullYear(), q: Math.floor(t.getMonth()/3) + 1 };
}
let obsQuarterState = currentQuarterObj();

function quarterLabel(q){
  const ranges = ['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'];
  return `Q${q} · ${ranges[q-1]}`;
}
function quarterBounds(year, q){
  const startMonth = (q-1)*3;
  const start = new Date(year, startMonth, 1);
  const end = new Date(year, startMonth+3, 0);
  return {start, end};
}
function inQuarter(dateStr, year, q){
  const d = parseDate(dateStr);
  if(!d) return false;
  const {start, end} = quarterBounds(year, q);
  return d >= start && d <= end;
}
/* Classify a coach's observation coverage for a given quarter using
   only "last observation" and "next observation" — this dataset doesn't
   keep a full history, so this is the best available signal. */
function quarterStatusForCoach(c, year, q){
  const next = c.coach.nextObs, last = c.coach.lastObs;
  if(inQuarter(next, year, q)) return {bucket:'scheduled', date:next};
  if(inQuarter(last, year, q)) return {bucket:'had', date:last};
  const {start, end} = quarterBounds(year, q);
  if(end < today()) return {bucket:'missing'};
  if(start <= today()) return {bucket:'needsBooking'};
  return {bucket:'future'};
}
function bucketChipHTML(st){
  if(st.bucket === 'had') return chipHTML({status:'green', text:'Completed ' + fmt(st.date)});
  if(st.bucket === 'scheduled') return chipHTML({status:'green', text:'Scheduled ' + fmt(st.date)});
  if(st.bucket === 'missing') return chipHTML({status:'red', text:'No record this quarter'});
  if(st.bucket === 'needsBooking') return chipHTML({status:'orange', text:'Needs booking'});
  return chipHTML({status:'gray', text:'Quarter not started'});
}
function quarterToggleHTML(current){
  return `<div class="toggle-group">
    ${[1,2,3,4].map(q => `<div class="toggle-btn ${q===current?'active':''}" onclick="setObsQuarter(${q})">${quarterLabel(q)}</div>`).join('')}
  </div>`;
}
function setObsQuarter(q){
  obsQuarterState.q = q;
  goTo('observations');
}

function flagBannerHTML(warnTitle, okText, coachNames){
  if(coachNames.length === 0){
    return `<div class="flag-banner ok"><span class="flag-icon">✓</span><span>${okText}</span></div>`;

    {key:'pre12', title:'Approaching 1-Year'},
    {key:'ramped', title:'Fully Ramped'}
  ];
  const staged = computed.map(c => ({c, stage: milestoneStage(c)}));

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="view-title">Milestones</div>
    <div class="view-sub">Each coach's stage is driven by their own start date — this shows where everyone sits in their ramp, not a due-date checklist.</div>
    <div class="kanban-grid">
      ${columns.map(col => {
        let members = staged.filter(s => s.stage.key === col.key);
        if(col.key === 'ramped'){
          members.sort((a,b) => a.c.coach.name.localeCompare(b.c.coach.name));
        } else {
          members.sort((a,b) => {
            const rd = RANK[b.stage.current.status] - RANK[a.stage.current.status];
            if(rd !== 0) return rd;
            const da = a.stage.current.dueDate, db = b.stage.current.dueDate;
            if(!da && !db) return 0;
            if(!da) return 1;
            if(!db) return -1;
            return new Date(da) - new Date(db);
          });
        }
        return `
          <div class="kanban-col">
            <h3>${col.title}</h3>
            <div class="kanban-count">${members.length}</div>
            ${members.length === 0
              ? `<div class="kanban-empty">No one here right now.</div>`
              : members.map(m => `
                <div class="kanban-card" onclick="goTo('coach:${m.c.coach.name.replace(/'/g,"\\'")}')">
                  <div class="kc-name">${m.c.coach.name}</div>
                  <div class="kc-sub">Started ${fmt(m.c.coach.startDate)}</div>
                  ${m.stage.current ? chipHTML(m.stage.current) : chipHTML({status:'green', text:'All milestones complete'})}
                </div>`).join('')}
          </div>`;
      }).join('')}
    </div>
    <div class="view-sub" style="margin-top:22px;">
      <span class="widget-footer-link" onclick="goTo('mile-all')">View full detail list for every coach →</span>
    </div>
  `;
}

/* ---------- category views (with attention/all toggle) ---------- */
function toggleGroupHTML(prefix, mode){
  return `<div class="toggle-group">
    <div class="toggle-btn ${mode==='attention'?'active':''}" onclick="goTo('${prefix}-attention')">Needs Attention</div>
    <div class="toggle-btn ${mode==='all'?'active':''}" onclick="goTo('${prefix}-all')">All Coaches</div>
  </div>`;
}

function renderCategoryAttention(catKey){
  const cat = CATEGORIES[catKey];
  const items = [];
  computed.forEach(c => {
    cat.items(c).forEach(chk => {
      if(chk.s.status === 'red' || chk.s.status === 'orange'){
        items.push({name:c.coach.name, label:chk.label, status:chk.s.status, text:chk.s.text});
      }
    });
  });
  items.sort((a,b) => (a.status === 'red' ? 0 : 1) - (b.status === 'red' ? 0 : 1));

  const main = document.getElementById('main-content');
  const listHTML = items.length === 0
    ? `<div class="empty-state"><div class="big">✓</div>Nothing needs attention in ${cat.label} right now.</div>`
    : `<div class="simple-list">${items.map(i => `
        <div class="simple-row attn-row ${i.status}" onclick="goTo('coach:${i.name.replace(/'/g,"\\'")}')">
          <div><div class="name">${i.name}</div><div class="item-label">${i.label} — ${i.text}</div></div>
          ${chipHTML({status:i.status, text:i.status === 'red' ? 'Overdue' : 'Due soon'})}
        </div>`).join('')}</div>`;

  main.innerHTML = `
    <div class="view-title">${cat.label}</div>
    <div class="view-sub">${items.length} item${items.length===1?'':'s'} flagged across the roster.</div>
    ${toggleGroupHTML(cat.prefix, 'attention')}
    ${listHTML}
  `;
}

function renderCategoryAll(catKey){
  const cat = CATEGORIES[catKey];
  const rows = computed
    .slice()
    .sort((a,b) => {
      const diff = RANK[cat.overall(b).status] - RANK[cat.overall(a).status];
      return diff !== 0 ? diff : a.coach.name.localeCompare(b.coach.name);
    });

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="view-title">${cat.label}</div>
    <div class="view-sub">${legendHTML()}</div>
    ${toggleGroupHTML(cat.prefix, 'all')}
    <div class="simple-list">
      ${rows.map(c => `
        <div class="simple-row" onclick="goTo('coach:${c.coach.name.replace(/'/g,"\\'")}')">
          <div class="name">${c.coach.name}</div>
          ${chipHTML(cat.overall(c))}
        </div>`).join('')}
    </div>
  `;
}

/* ---------- coach detail ---------- */
function progressBarHTML(c){
  const start = c.coach.startDate;
  let fillPct = 0;
  if(start){
    const daysSince = -daysFromToday(start);
    fillPct = Math.max(0, Math.min(100, (daysSince / 365) * 100));
  }
  const nodes = [
    {label:'Start', pct:0, status:'green'},
    {label:'3-Month', pct:25, status:c.milestones.m3.status},
    {label:'6-Month', pct:50, status:c.milestones.m6.status},
    {label:'1-Year', pct:100, status:c.milestones.m12.status}
  ];
  return `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${fillPct}%"></div></div>
      ${nodes.map(n => `
        <div class="progress-node ${n.status}" style="left:${n.pct}%"></div>
        <div class="progress-label" style="left:${n.pct}%">${n.label}</div>
      `).join('')}
    </div>`;
}

function historyTimelineHTML(c){
  const rows = (c.log && c.log.rows) || [];
  if(rows.length === 0){
    return `<div class="empty-state" style="padding:22px;"><div class="big">–</div>No observation history logged yet.</div>`;
  }
  return `<div class="simple-list">${rows.map(r => `
    <div class="simple-row" style="cursor:default;">
      <div>
        <div class="name">${fmt(r.obsDate)} <span style="color:var(--ink-soft); font-weight:500; font-size:0.78rem;">— ${r.studio || 'Studio n/a'}${r.observedBy ? ' · observed by ' + r.observedBy : ''}</span></div>
        ${r.notes ? `<div class="item-label">${r.notes}</div>` : ''}
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        ${isTruthyFlag(r.concern) ? chipHTML({status:'red', text:'Concern raised'}) : chipHTML({status:'green', text:'No concern'})}
        ${isTruthyFlag(r.concern)
          ? (isTruthyFlag(r.followUpCompleted)
              ? chipHTML({status:'green', text:'Follow-up 1:1 done ' + fmt(r.followUpCompletedDate || r.followUpDate)})
              : chipHTML({status:'orange', text:'Follow-up 1:1 needed'}))
          : ''}
      </div>
    </div>`).join('')}</div>`;
}

  const c = computed.find(x => x.coach.name === name);

  const main = document.getElementById('main-content');
  const openLoopBanner = (c.log && c.log.openLoop)
    ? `<div class="flag-banner warn" style="margin-bottom:14px;">
        <span class="flag-icon">⚠</span>
        <span class="flag-title">Open loop:</span>
        <span>Observation on ${fmt(c.log.openLoop.obsDate)} raised a concern — the follow-up 1:1 hasn't been marked complete yet.</span>
      </div>`
    : '';
  main.innerHTML = `
    <div class="view-title">${c.coach.name}</div>
    <div class="view-sub">Start date: ${fmt(c.coach.startDate)}</div>

    ${openLoopBanner}

    <div class="section-card" style="margin-bottom:14px;">
      <h3>Development Journey</h3>
      ${progressBarHTML(c)}
    </div>

    <div class="detail-grid">
      <div class="section-card">
        <h3>Development Milestones</h3>
        <div class="row-item"><span class="label">3-Month</span>${chipHTML(c.milestones.m3)}</div>
        <div class="row-item"><span class="label">6-Month</span>${chipHTML(c.milestones.m6)}</div>
        <div class="row-item"><span class="label">1-Year</span>${chipHTML(c.milestones.m12)}</div>
      </div>
      <div class="section-card">
        <h3>Observations &amp; 1:1s</h3>
        <div class="row-item"><span class="label">Last Observation</span><span class="val">${fmt((c.log && c.log.latest ? c.log.latest.obsDate : c.coach.lastObs))}</span></div>
        <div class="row-item"><span class="label">Next Observation</span>${chipHTML(c.observations.obs)}</div>
        <div class="row-item"><span class="label">Last 1:1</span><span class="val">${fmt(c.coach.last1on1)}</span></div>
        <div class="row-item"><span class="label">Next 1:1</span>${chipHTML(c.observations.oneOnOne)}</div>
      </div>
      <div class="section-card">
        <h3>Compliance</h3>
        <div class="row-item"><span class="label">Liability Insurance</span>${chipHTML(c.compliance.liability)}</div>
        <div class="row-item"><span class="label">First Aid Certification</span>${chipHTML(c.compliance.firstAid)}</div>
        <div class="row-item"><span class="label">Fire Training</span>${chipHTML(c.compliance.fire)}</div>
      </div>
      <div class="section-card">
        <h3>Performance &amp; Development</h3>
        <div class="row-item"><span class="label">Current Flag</span>${chipHTML(flagStatus(c.coach.currentFlag))}</div>
        <div class="row-item"><span class="label">Development Plan</span>${chipHTML(devPlanStatus(c))}</div>
      </div>
    </div>

    <div class="section-label">Observation history</div>
    ${historyTimelineHTML(c)}
  `;
}

/* ---------- router ---------- */
let currentView = 'dashboard';

function tabKeyForView(view){
  if(view === 'dashboard') return 'dashboard';
  if(view === 'upcoming') return 'upcoming';
  if(view === 'roster' || view.startsWith('coach:')) return 'roster';
  if(view === 'milestones' || view.startsWith('mile-')) return 'milestones';
  if(view === 'observations' || view.startsWith('obs-')) return 'observations';
  if(view.startsWith('comp-')) return 'compliance';
  return '';
}

function updateTabbar(view){
  const key = tabKeyForView(view);
  document.querySelectorAll('#tabbar .tab').forEach(t => {
    t.classList.toggle('active', t.getAttribute('data-tab') === key);
  });
}

function goTo(view){
  currentView = view;
  if(view === 'dashboard') renderDashboard();
  else if(view === 'upcoming') renderUpcoming();
  else if(view === 'roster') renderRoster();
  else if(view === 'observations') renderObservationsHome();
  else if(view === 'milestones') renderMilestonesKanban();
  else if(view === 'obs-attention') renderCategoryAttention('observations');
  else if(view === 'obs-all') renderCategoryAll('observations');
  else if(view === 'mile-attention') renderCategoryAttention('milestones');
  else if(view === 'mile-all') renderCategoryAll('milestones');
  else if(view === 'comp-attention') renderCategoryAttention('compliance');
  else if(view === 'comp-all') renderCategoryAll('compliance');
  else if(view.startsWith('coach:')) renderCoachDetail(view.slice(6));
  updateTabbar(view);
  window.scrollTo(0,0);
}

/* ---------- live Google Sheet fetch (no auth — read-only, public link) ---------- */
function gvizDateToISO(v){
  if(typeof v === 'string' && v.indexOf('Date(') === 0){
    const parts = v.replace('Date(','').replace(')','').split(',').map(Number);
    const d = new Date(parts[0], parts[1], parts[2]); // gviz month is already 0-indexed
    return d.toISOString().slice(0,10);
  }
  return v;
}

async function fetchSheetJSON(tabName){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}&headers=1`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)\s*;?\s*$/);
  if(!match) throw new Error('Unexpected response from Google Sheets — check sharing settings');
  return JSON.parse(match[1]);
}

function parseCoachSheet(json){
  const cols = (json.table.cols || []).map(c => String(c.label || '').trim().toLowerCase());
  const rows = json.table.rows || [];
  return rows.map(r => {
    const cells = r.c || [];
    const obj = {};
    cols.forEach((label, i) => {
      const cell = cells[i];
      let v = cell ? cell.v : null;
      if(typeof v === 'string' && v.indexOf('Date(') === 0) v = gvizDateToISO(v);
      obj[label] = (v === null || v === undefined) ? '' : v;
    });
    return obj;
  });
}

function getVal(obj, includes, excludes){
  excludes = excludes || [];
  for(const k in obj){
    if(includes.every(s => k.indexOf(s) !== -1) && !excludes.some(s => k.indexOf(s) !== -1)){
      return obj[k];
    }
  }
  return '';
}

function mapRawRow(obj){
  return {
    name: getVal(obj, ['coach','name']),
    startDate: getVal(obj, ['start','date']),
    liabilityDate: getVal(obj, ['liability','date'], ['expiry']),
    liabilityExpiry: getVal(obj, ['liability','expiry']),
    firstAidDate: getVal(obj, ['first aid','date'], ['expiry']),
    firstAidExpiry: getVal(obj, ['first aid','expiry']),
    fireTrainingDate: getVal(obj, ['fire training'], ['expiry']),
    m3Date: getVal(obj, ['3 month']),
    m6Date: getVal(obj, ['6 month']),
    m12Date: getVal(obj, ['1 year']) || getVal(obj, ['12 month']),
    lastObs: getVal(obj, ['last observation']),
    nextObs: getVal(obj, ['next observation']),
    last1on1: getVal(obj, ['last','1:1']),
    next1on1: getVal(obj, ['next','1:1']),
    onDevPlan: getVal(obj, ['development','plan'], ['start']),
    devPlanStart: getVal(obj, ['development','plan','start']),
    currentFlag: getVal(obj, ['current','flag']),
  };
}

function mapLogRow(obj){
  return {
    name: getVal(obj, ['coach','name']),
    studio: getVal(obj, ['studio']),
    obsDate: getVal(obj, ['observation','date']),
    observedBy: getVal(obj, ['observed','by']),
    concern: getVal(obj, ['concern']),
    notes: getVal(obj, ['notes']),
    followUpDate: getVal(obj, ['follow','1:1','date'], ['completed']),
    followUpCompleted: getVal(obj, ['follow','1:1','completed'], ['date']),
    followUpCompletedDate: getVal(obj, ['follow','1:1','completed','date']),
  };
}

function isTruthyFlag(v){
  if(!v) return false;
  const s = String(v).trim().toLowerCase();
  return s === 'y' || s === 'yes' || s === 'true' || s === '1';
}

let logEntries = [];

async function loadObservationLog(){
  try {
    const json = await fetchSheetJSON(LOG_TAB_NAME);
    const rawRows = parseCoachSheet(json);
    const mapped = rawRows.map(mapLogRow).filter(r => r.name && String(r.name).trim() !== '');
    logEntries = mapped;
    LOG_IS_LIVE = true;
  } catch(err){
    console.warn('Observation Log tab not reachable yet, using sample history:', err);
    logEntries = FALLBACK_LOG_DATA;
    LOG_IS_LIVE = false;
  }
}

/* attach history + open-loop info derived from the Observation Log to a computed coach */
function normalizeName(s){
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function attachLogData(c){
  const target = normalizeName(c.coach.name);
  const rows = logEntries
    .filter(r => normalizeName(r.name) === target)
    .slice()
    .sort((a,b) => (parseDate(b.obsDate)||0) - (parseDate(a.obsDate)||0));
  const openLoop = rows.find(r => isTruthyFlag(r.concern) && !isTruthyFlag(r.followUpCompleted)) || null;
  c.log = { rows, latest: rows[0] || null, openLoop };
  return c;
}

async function loadLiveData(){
  try {
    if(SHEET_ID === 'PASTE_YOUR_SPREADSHEET_ID_HERE') throw new Error('No Sheet ID configured yet');
    const json = await fetchSheetJSON(TAB_NAME);
    const rawRows = parseCoachSheet(json);
    const mapped = rawRows.map(mapRawRow).filter(c => c.name && String(c.name).trim() !== '');
    if(mapped.length === 0) throw new Error('No coach rows found — check TAB_NAME and sheet headers');
    computed = mapped.map(computeCoach);
    IS_LIVE = true;
    LAST_SYNCED = new Date();
  } catch(err){
    console.warn('Live sheet fetch failed, showing saved snapshot instead:', err);
    computed = FALLBACK_DATA.map(computeCoach);
    IS_LIVE = false;
  }
  await loadObservationLog();
  computed.forEach(attachLogData);
  renderCoachLinks();
  goTo(currentView);
  renderDataFooter();
}

/* ---------- data status footer ---------- */
function renderDataFooter(){
  const el = document.getElementById('data-status-footer');
  const editLink = SHEET_ID !== 'PASTE_YOUR_SPREADSHEET_ID_HERE'
    ? `<a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank" style="color:var(--brand); text-decoration:none; margin-left:auto;">Open Google Sheet to edit ↗</a>`
    : '';
  if(IS_LIVE){
    const t = LAST_SYNCED ? LAST_SYNCED.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : '';
    el.innerHTML = `<span class="status-dot live"></span> <strong>Live &amp; linked to Google Sheets</strong> — last synced ${t} ${editLink}`;
  } else {
    el.innerHTML = `<span class="status-dot static"></span> Not connected — showing saved snapshot (${fmt(SNAPSHOT_DATE)}). Check SHEET_ID / sharing settings. ${editLink}`;
  }
}

/* ---------- init ---------- */
loadLiveData();
setInterval(loadLiveData, 60000); // re-sync every 60 seconds
</script>
